descriptionShort:
  en: "Collection of small utility scripts: photo quality reducer, smart backup copier (recursive, date-filtered), and other misc tools. Built with Python for personal automation tasks."
  es: "Colección de pequeños scripts de utilidad: reductor de calidad de fotos, copiador de backups inteligente (recursivo, filtrado por fecha), y otras herramientas varias. Construido con Python para tareas de automatización personal."
descriptionLong:
  en: |
    A grab-bag of small, practical Python scripts for personal automation and file management. Includes: an image quality reducer that batch-processes photos to save storage, a smart photo backup copier that recursively copies files from devices to backup drives with date filtering (only copies files from a given date forward) and file pattern exclusion, and other miscellaneous tools accumulated over time. Serves as a personal toolkit for common file operations.
  es: |
    Un cajón de sastre de pequeños scripts Python prácticos para automatización personal y gestión de archivos. Incluye: un reductor de calidad de imágenes que procesa fotos en lote para ahorrar espacio, un copiador de backups inteligente que copia recursivamente archivos desde dispositivos a discos de respaldo con filtrado por fecha (solo copia archivos desde una fecha dada en adelante) y exclusión por patrón de archivo, y otras herramientas varias acumuladas con el tiempo. Sirve como kit de herramientas personal para operaciones comunes de archivos.
